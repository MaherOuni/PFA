<div class="auth-shell">
  <div class="auth-card">
    <div class="auth-brand">
      <img src="assets/img/brand/helmet.svg" alt="" />
      <span>LABORHELM</span>
    </div>

    <h1 class="auth-title">Connexion</h1>
    <p class="auth-sub">Gestion de stock et point de vente</p>

    <form role="form" (ngSubmit)="authenticate()">
      <div class="form-group mb-3">
        <label class="form-control-label" for="login-user">Nom d'utilisateur</label>
        <div class="input-group input-group-alternative">
          <div class="input-group-prepend">
            <span class="input-group-text"><i class="ni ni-circle-08"></i></span>
          </div>
          <input
            id="login-user"
            class="form-control"
            placeholder="Nom d'utilisateur"
            autocomplete="username"
            [(ngModel)]="login"
            [ngModelOptions]="{standalone: true}"
            type="text"
          />
        </div>
      </div>

      <div class="form-group mb-4">
        <label class="form-control-label" for="login-pass">Mot de passe</label>
        <div class="input-group input-group-alternative">
          <div class="input-group-prepend">
            <span class="input-group-text"><i class="ni ni-lock-circle-open"></i></span>
          </div>
          <input
            id="login-pass"
            class="form-control"
            placeholder="Mot de passe"
            autocomplete="current-password"
            [(ngModel)]="password"
            [ngModelOptions]="{standalone: true}"
            type="password"
          />
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-lg btn-block">
        Se connecter
      </button>

      <p class="auth-error" *ngIf="error">{{ error }}</p>
    </form>

    <!--
      Demo entry point. Hidden when DEMO_MODE is baked in, because that build
      routes straight past this screen anyway.
    -->
    <ng-container *ngIf="!demo.forced">
      <div class="auth-divider">ou</div>

      <button type="button" class="btn btn-secondary btn-lg btn-block" (click)="startDemo()">
        <i class="fas fa-play mr-2"></i>
        Explorer la demo
      </button>

      <p class="auth-hint">
        Aucun compte requis. Donnees fictives, gardees dans ce navigateur.
      </p>
    </ng-container>
  </div>
</div>
