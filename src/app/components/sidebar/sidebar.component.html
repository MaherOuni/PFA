<nav
  class="navbar navbar-vertical navbar-expand-md navbar-light bg-white"
  id="sidenav-main"
>
  <div class="container-fluid">
    <!-- Toggler -->
    <button
      class="navbar-toggler"
      type="button"
      (click)="isCollapsed = !isCollapsed"
      aria-controls="sidenav-collapse-main"
    >
      <span class="navbar-toggler-icon"></span>
    </button>
    <!-- Brand -->
    <a
      class="navbar-brand pt-0 "
      routerLinkActive="active"
      [routerLink]="['/dashboard']"
    >
    <div class="row" style="justify-content: center;">
      <img
        src="../../../assets/img/brand/helmet.svg"
        class=""
        alt="..."
        style="width: 50px !important;;"
      />
      <p style="width: fit-content; height:fit-content;margin:0 0 0 0 !important;padding-top:5px;padding-left:5px;font-weight:900;font-size: 21px;color:#554E56;font-family: 'Dela Gothic One', cursive;">LABORHELM</p>
    </div>
    </a>
    <!-- User -->
    <ul class="nav align-items-center d-md-none">
      <li class="nav-item" ngbDropdown placement="bottom-right">
        <a class="nav-link nav-link-icon" role="button" ngbDropdownToggle>
          <i class="ni ni-bell-55"></i>
        </a>
        <div class="dropdown-menu-arrow dropdown-menu-right" ngbDropdownMenu>
          <a class="dropdown-item" href="javascript:void(0)">Action</a>
          <a class="dropdown-item" href="javascript:void(0)">Another action</a>
          <div class="dropdown-divider"></div>
          <a class="dropdown-item" href="javascript:void(0)"
            >Something else here</a
          >
        </div>
      </li>
      <li class="nav-item" ngbDropdown placement="bottom-right">
        <a class="nav-link" role="button" ngbDropdownToggle>
          <div class="media align-items-center">
            <span class="avatar avatar-sm rounded-circle">
              <img
                alt="Image placeholder"
                src="./assets/img/theme/team-1-800x800.jpg"
              />
            </span>
          </div>
        </a>
        <div class="dropdown-menu-arrow dropdown-menu-right" ngbDropdownMenu>
          <div class="dropdown-header noti-title">
            <h6 class="text-overflow m-0">Welcome!</h6>
          </div>
          <a
            routerLinkActive="active"
            [routerLink]="['/user-profile']"
            class="dropdown-item"
          >
            <i class="ni ni-single-02"></i>
            <span>My profile</span>
          </a>
          <a
            routerLinkActive="active"
            [routerLink]="['/user-profile']"
            class="dropdown-item"
          >
            <i class="ni ni-settings-gear-65"></i>
            <span>Settings</span>
          </a>
          <a
            routerLinkActive="active"
            [routerLink]="['/user-profile']"
            class="dropdown-item"
          >
            <i class="ni ni-calendar-grid-58"></i>
            <span>Activity</span>
          </a>
          <a
            routerLinkActive="active"
            [routerLink]="['/user-profile']"
            class="dropdown-item"
          >
            <i class="ni ni-support-16"></i>
            <span>Support</span>
          </a>
          <div class="dropdown-divider"></div>
          <a href="#!" class="dropdown-item">
            <i class="ni ni-user-run"></i>
            <span>Logout</span>
          </a>
        </div>
      </li>
    </ul>
    <!-- Collapse -->
    <div
      class="collapse navbar-collapse"
      [ngbCollapse]="isCollapsed"
      id="sidenav-collapse-main"
    >
      <!-- Collapse header -->
      <div class="navbar-collapse-header d-md-none">
        <div class="row">
          <div class="col-6 collapse-brand">
            <a routerLinkActive="active" [routerLink]="['/dashboard']">
              <img src="./assets/img/brand/blue.png" />
            </a>
          </div>
          <div class="col-6 collapse-close">
            <button
              type="button"
              class="navbar-toggler"
              (click)="isCollapsed = !isCollapsed"
            >
              <span></span>
              <span></span>
            </button>
          </div>
        </div>
      </div>
      <!-- Form -->
      <form class="mt-4 mb-3 d-md-none">
        <div class="input-group input-group-rounded input-group-merge">
          <input
            type="search"
            class="form-control form-control-rounded form-control-prepended"
            placeholder="Search"
            aria-label="Search"
          />
          <div class="input-group-prepend">
            <div class="input-group-text">
              <span class="fa fa-search"></span>
            </div>
          </div>
        </div>
      </form>
      <!-- Navigation -->
      <ul class="navbar-nav">
        <li
          *ngFor="let menuItem of menuItems"
          class="{{ menuItem.class }} nav-item"
        >
          <a
            routerLinkActive="active"
            [routerLink]="[menuItem.path]"
            class="nav-link"
          >
            <lord-icon
              *ngIf="menuItem.title == 'Point de vente'"
              src="../../../assets/lottie/146-basket-trolley-shopping-card-outline-edited.json"
              trigger="hover"
              colors="primary:#d2b48c,secondary:#464f4f"
              stroke="80"
              style="width: 40px; height: 40px"
            ></lord-icon>
            <lord-icon
              *ngIf="menuItem.title == 'Produits'"
              src="../../../assets/lottie/107-box-package-open-outline-edited.json"
              trigger="morph"
              colors="primary:#464f4f,secondary:#5e72e4"
              stroke="80"
              style="width: 40px; height: 40px"
            ></lord-icon>
            <lord-icon
              *ngIf="menuItem.title == 'Categories'"
              src="../../../assets/lottie/112-book-morph-outline-edited.json"
              trigger="morph"
              colors="primary:#f4a460,secondary:#464f4f"
              stroke="80"
              style="width: 40px; height: 40px"
            ></lord-icon>
            <lord-icon
              *ngIf="menuItem.title == 'Clients'"
              src="../../../assets/lottie/269-avatar-female-outline-edited.json"
              trigger="morph"
              colors="primary:#464f4f,secondary:#ffd600"
              stroke="80"
              style="width: 40px; height: 40px"
            ></lord-icon>
            <lord-icon
              *ngIf="menuItem.title == 'Fournisseurs'"
              src="../../../assets/lottie/497-truck-delivery-outline-edited.json"
              trigger="morph"
              colors="primary:#464f4f,secondary:#fb6340"
              stroke="80"
              style="width: 40px; height: 40px"
            ></lord-icon>
            <lord-icon
              *ngIf="menuItem.title == 'Dépôt'"
              src="../../../assets/lottie/63-home-outline-edited.json"
              trigger="morph"
              colors="primary:#464f4f,secondary:#f5365c"
              stroke="80"
              style="width: 40px; height: 40px"
            ></lord-icon>
            <lord-icon
              *ngIf="menuItem.title == 'Vents'"
              src="https://cdn.lordicon.com/cjieiyzp.json"
              trigger="hover"
              colors="primary:#2dce89,secondary:#464f4f"
              stroke="80"
              style="width: 40px; height: 40px"
            >
            </lord-icon>
            <lord-icon
              *ngIf="menuItem.title == 'Personnels'"
              src="https://cdn.lordicon.com/nobciafz.json"
              trigger="hover"
              colors="primary:#464f4f,secondary:#8965e0"
              stroke="80"
              style="width: 40px; height: 40px"
            >
            </lord-icon>
            <lord-icon
              *ngIf="menuItem.title == 'Revenu'"
              src="https://cdn.lordicon.com/gqdnbnwt.json"
              trigger="hover"
              colors="primary:#464f4f,secondary:#f3a4b5"
              stroke="79"
              style="width: 40px; height: 40px"
            >
            </lord-icon>
            {{ menuItem.title }}
          </a>
        </li>
      </ul>
      <!-- Divider -->
    </div>
  </div>
</nav>
