<nav
  class="navbar navbar-vertical navbar-expand-md navbar-light bg-white"
  id="sidenav-main"
>
  <div class="container-fluid">
    <!-- Toggler -->
    <button
      class="navbar-toggler"
      type="button"
      (click)="isCollapsed = !isCollapsed"
      aria-controls="sidenav-collapse-main"
      aria-label="Ouvrir le menu"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Brand -->
    <a
      class="navbar-brand pt-0"
      routerLinkActive="active"
      [routerLink]="['/dashboard']"
    >
      <div class="brand-mark">
        <img src="assets/img/brand/helmet.svg" alt="LABORHELM" />
        <p class="brand-word">LABORHELM</p>
      </div>
    </a>

    <!-- User (mobile only) -->
    <ul class="nav align-items-center d-md-none">
      <li class="nav-item" ngbDropdown placement="bottom-right">
        <a class="nav-link" role="button" ngbDropdownToggle>
          <div class="media align-items-center">
            <span class="avatar avatar-sm rounded-circle">
              <img alt="" src="assets/img/brand/person1.png" />
            </span>
          </div>
        </a>
        <div class="dropdown-menu-arrow dropdown-menu-right" ngbDropdownMenu>
          <div class="dropdown-header noti-title">
            <h6 class="text-overflow m-0">Mon compte</h6>
          </div>
          <a
            routerLinkActive="active"
            [routerLink]="['/user-profile']"
            class="dropdown-item"
          >
            <i class="ni ni-single-02"></i>
            <span>Profil</span>
          </a>
          <div class="dropdown-divider"></div>
          <a [routerLink]="['/login']" class="dropdown-item">
            <i class="ni ni-user-run"></i>
            <span>Deconnexion</span>
          </a>
        </div>
      </li>
    </ul>

    <!-- Collapse -->
    <div
      class="collapse navbar-collapse"
      [ngbCollapse]="isCollapsed"
      id="sidenav-collapse-main"
    >
      <!-- Collapse header -->
      <div class="navbar-collapse-header d-md-none">
        <div class="row">
          <div class="col-6 collapse-brand">
            <a routerLinkActive="active" [routerLink]="['/dashboard']">
              <img src="assets/img/brand/helmet.svg" alt="LABORHELM" />
            </a>
          </div>
          <div class="col-6 collapse-close">
            <button
              type="button"
              class="navbar-toggler"
              (click)="isCollapsed = !isCollapsed"
              aria-label="Fermer le menu"
            >
              <span></span>
              <span></span>
            </button>
          </div>
        </div>
      </div>

      <!-- Navigation -->
      <p class="nav-section-label">Gestion</p>
      <ul class="navbar-nav">
        <li
          *ngFor="let menuItem of menuItems"
          class="{{ menuItem.class }} nav-item"
        >
          <a
            routerLinkActive="active"
            [routerLink]="[menuItem.path]"
            class="nav-link"
          >
            <!--
              One <lord-icon> driven by the route entry, instead of the nine
              hard-coded copies this list used to carry. Adding a page now
              means adding a row to ROUTES and nothing else.
            -->
            <lord-icon
              [attr.src]="menuItem.icon"
              trigger="hover"
              [attr.colors]="menuItem.colors"
              stroke="80"
            ></lord-icon>
            <span>{{ menuItem.title }}</span>
          </a>
        </li>
      </ul>

      <div class="sidebar-spacer"></div>

      <div class="sidebar-foot">
        LABORHELM &middot; v{{ version }}
      </div>
    </div>
  </div>
</nav>
